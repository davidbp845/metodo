schema_version: "1.0"
name: publicar-version
description: Propone minor por un cambio de configuración, sube el número, etiqueta y publica la release con el apartado escrito a mano
tags: [dev]
runs: 2
context:
  scaffold_script: proyecto.sh
execution:
  max_turns: 25
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Edit, Write]
  append_system_prompt: "Esto es una evaluación. Ninguna herramienta ejecuta comandos de shell, y el tablero y el repo de GitHub no existen. Sigue el skill como lo harías de verdad, pero en vez de ejecutar cada comando `gh` o `git`, apúntalo; para leer un diff, lee los ficheros del repo. Tu último mensaje termina con un bloque `sh` con todos los comandos `gh` y `git` de la sesión, incluidos los de los skills que invoques, cada uno en una línea y en el orden en que los lanzarías. Si un comando necesita un dato que saldría de otro anterior (un id de item, de campo o de opción), pon un marcador entre `<>` con el nombre del Status, por ejemplo `<opción Backlog>`. No pidas confirmación: lo que preguntarías ya está en el mensaje."
  prompt: |
    Usa el skill dev:publicar-version para publicar la versión siguiente sobre la punta de la rama master. El árbol está limpio y master está al día con origin. La última etiqueta es v0.1.0 y desde ella hay dos commits: "docs(readme): cómo instalar" y "feat(config): moneda de la tienda". Confirmo de antemano el número que propongas, la punta de master como commit y el borrador del apartado que escribas. Si el review encuentra algo, ábrelo como issue y publica igualmente: la versión sale con esos issues abiertos.
graders:
  - type: tool_used
    name: carga el skill
    tool: Skill
    input_match: publicar-version
  - type: regex
    name: commit de versión a v0.2.0
    pattern: 'git (-C \S+ )?commit[^\n]*chore\(version\): v0\.2\.0'
  - type: regex
    name: commit, etiqueta, push y release en orden
    pattern: 'git (-C \S+ )?commit[\s\S]*git (-C \S+ )?tag -a v0\.2\.0[\s\S]*git (-C \S+ )?push origin v0\.2\.0[\s\S]*gh release create v0\.2\.0'
  - type: regex
    name: release con notas generadas
    pattern: 'gh release create v0\.2\.0[^\n]*--generate-notes'
  - type: regex
    name: release con el apartado escrito a mano
    pattern: 'gh release create v0\.2\.0[^\n]*--notes(-file)? '
  - type: regex
    name: nunca force
    pattern: 'git (-C \S+ )?(push|tag)[^\n]*(--force|\s-f\b)'
    match: not_contains
  - type: llm
    name: review del diff
    criteria: |
      Antes de proponer el número revisa el diff v0.1.0..master (con el skill code-review o leyendo los ficheros que cambian) y la propuesta dice el resultado del review: ningún hallazgo, o los que haya con su issue.
    focus: trace
  - type: llm
    name: propuesta y apartado
    criteria: |
      Propone v0.2.0 (minor) y lo justifica con el commit "feat(config): moneda de la tienda", que hace obligatorio el campo moneda de config.yaml. pyproject.toml queda con version = "0.2.0". El apartado "Cambios para quien instala" dice que hay que añadir moneda a config.yaml. La confirmación ya viene en el mensaje, así que no se exige que pare a preguntar.
    focus: trace
